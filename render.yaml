services:
  - type: web
    name: ai-sales-analytics-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_PROVIDER
        value: none
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./sales_analytics.db
      - key: STORAGE_DIR
        value: uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "25"
      - key: FRONTEND_ORIGIN
        sync: false

  - type: web
    name: ai-sales-analytics-frontend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: ai-sales-analytics-backend
          property: host
