# Render Blueprint Deployment Configuration for Backend ONLY
# Note: SQLite database storage on Render Free tier is temporary and ephemeral.
# Container restarts or re-deployments will reset local SQLite data and uploaded files
# unless connected to a managed database (e.g. PostgreSQL) and persistent storage bucket.

services:
  - type: web
    name: ai-sales-analytics-backend
    env: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    envVars:
      - key: AI_PROVIDER
        value: none
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./sales_analytics.db
      - key: STORAGE_DIR
        value: uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "25"
      - key: FRONTEND_ORIGIN
        sync: false
